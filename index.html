<style>
  :root{
    --red:#E62117; --green:#00A651; --blue:#0090D4;
    --ink:#1D2A38; --sub:#5B6B7B; --line:#E3EAF0;
    --red-bg:rgba(230,33,23,.16); --green-bg:rgba(0,166,81,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#FDFEFF 0%,#EFF6FA 100%);
    min-height:100vh;
  }
  .wrap{max-width:860px;margin:0 auto;padding:20px 18px 34px}
  header{text-align:center;padding-top:8px}
  header img.lockup{width:min(320px,78vw);height:auto}
  .tri{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:16px 0 14px}
  .tri span{flex:1}
  .tri .r{background:var(--red)} .tri .g{background:var(--green)} .tri .b{background:var(--blue)}
  h1{font-size:21px;font-weight:700;letter-spacing:.02em}
  .subtitle{color:var(--sub);font-size:13px;margin-top:6px}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:14px;margin-top:18px;box-shadow:0 6px 24px rgba(29,42,56,.05);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-head .t{font-size:16px;font-weight:700}
  select#toc{
    font-size:13px;color:var(--blue);background:#EAF5FC;border:1px solid #BFE2F5;
    border-radius:10px;padding:7px 8px;max-width:52vw;outline:none;cursor:pointer;
  }
  .pdf-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#F7FAFC}
  .pdf-box iframe{width:100%;height:min(72vh,900px);border:0;display:block;background:#fff}
  .pdf-actions{display:flex;gap:8px;margin-top:10px}
  .pdf-actions a{
    flex:1;text-align:center;text-decoration:none;font-size:13.5px;color:var(--ink);
    background:#F0F5F9;border:1px solid var(--line);border-radius:10px;padding:9px 4px;
  }
  .pdf-actions a:hover{background:#E7F0F7}
  .stats{text-align:center;color:var(--sub);font-size:13px;line-height:1.7;margin-top:16px;white-space:pre-line}
  .stats button{
    background:none;border:none;color:#9AA9B8;font-size:12px;cursor:pointer;margin-top:4px;text-decoration:underline;
  }
  .big-btn{
    display:block;width:100%;margin-top:16px;border:none;cursor:pointer;
    color:#fff;font-size:18px;font-weight:700;letter-spacing:.04em;
    padding:15px 0;border-radius:16px;
    background:linear-gradient(90deg,var(--blue),var(--green));
    box-shadow:0 8px 20px rgba(0,144,212,.25);
    transition:transform .08s ease, box-shadow .2s ease;
  }
  .big-btn:hover{box-shadow:0 10px 26px rgba(0,144,212,.35)}
  .big-btn:active{transform:scale(.985)}
  footer{text-align:center;color:#9AA9B8;font-size:12px;margin-top:22px;line-height:1.8}

  /* ---------- quiz ---------- */
  #quizView{display:none}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ghost-btn{
    border:1px solid var(--line);background:#F0F5F9;color:var(--ink);
    border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  .meta{font-size:13px;color:var(--sub);font-weight:700;text-align:right}
  .q-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:18px 16px;margin-top:14px;box-shadow:0 6px 24px rgba(29,42,56,.05);
  }
  .q-num{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em;margin-bottom:8px}
  .q-text{font-size:18px;font-weight:700;line-height:1.55}
  .opts{margin-top:6px;display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:13px 14px;font-size:16px;color:var(--ink);line-height:1.5;
    transition:background .15s ease,border-color .15s ease;
  }
  .opt:hover:not(:disabled){border-color:#BCD7EA;background:#F7FBFE}
  .opt:disabled{cursor:default}
  .opt .letter{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:#EFF4F8;color:var(--sub);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt .mark{margin-left:auto;font-size:22px;font-weight:800;flex:0 0 auto;width:26px;text-align:center}
  .opt.correct{background:var(--green-bg);border-color:var(--green)}
  .opt.correct .mark{color:var(--green)}
  .opt.correct .letter{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-bg);border-color:var(--red)}
  .opt.wrong .mark{color:var(--red)}
  .opt.wrong .letter{background:var(--red);color:#fff}
  .opt.dim{opacity:.55}
  .result{text-align:center;font-size:17px;font-weight:800;margin-top:16px;min-height:24px}
  .result.ok{color:var(--green)} .result.bad{color:var(--red)}
  .source{color:var(--sub);font-size:13.5px;line-height:1.65;margin-top:6px;white-space:pre-line}
  #nextBtn{display:none}
  @media (max-width:520px){
    .q-text{font-size:17px} .opt{font-size:15px}
    .pdf-box iframe{height:62vh}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= HOME ================= -->

 "opts": ["應為其決定提出依據", "須將卷宗發回預審員重新建議", "自動改按預審員的建議科處", "須先取得嫌疑人同意"], "a": 0, "src": "第七十一條第三款（報告及決定）", "exp": ""}, {"q": "在甚麼情況下，得命令開展調查程序？", "opts": ["違紀行為非為確定、不知道誰為違紀者，或需要調查以釐清事實時", "嫌疑人拒絕提交書面答辯時", "違紀行為涉及領導人員時", "僱員提出申訴時"], "a": 0, "src": "第七十二條（調查程序）", "exp": ""}, {"q": "調查程序適用甚麼程序的規定？", "opts": ["紀律程序之規定", "刑事訴訟程序之規定", "行政程序之規定", "由調查員自行訂定的程序"], "a": 0, "src": "第七十四條（適用制度）", "exp": ""}];

// chapters: [title, pdf page (1-based)]
const CHAPTERS = [
  ["通告第 16/2025 號（重新公佈）", 1],
  ["第一章　總則", 2],
  ["第二章　權利、義務和保障", 3],
  ["第三章　僱員之錄取", 7],
  ["第四章　職程、職級、晉階、晉升、職業培訓和提升", 11],
  ["第五章　提供工作", 12],
  ["第六章　年假", 19],
  ["第七章　缺勤", 21],
  ["第八章　報酬", 30],
  ["第九章　福利及社會保障", 33],
  ["第十章　合同之終止", 33],
  ["第十一章　紀律制度", 38]
];

const $ = id => document.getElementById(id);
const store = {
  get asked(){ return +localStorage.getItem('hrq_asked') || 0 },
  get correct(){ return +localStorage.getItem('hrq_correct') || 0 },
  get wrong(){ try { return new Set(JSON.parse(localStorage.getItem('hrq_wrong') || '[]')) } catch(e){ return new Set() } },
  save(asked, correct, wrong){
    localStorage.setItem('hrq_asked', asked);
    localStorage.setItem('hrq_correct', correct);
    localStorage.setItem('hrq_wrong', JSON.stringify([...wrong]));
  },
  clear(){ localStorage.removeItem('hrq_asked'); localStorage.removeItem('hrq_correct'); localStorage.removeItem('hrq_wrong'); }
};
let wrongPool = store.wrong;
let qIndex = -1, optOrder = [], answered = false, quizCount = 0;

function statsText(){
  let base = '題庫共 ' + QUESTIONS.length + ' 題 · 隨機抽題 · 無限練習';
  const a = store.asked;
  if (a > 0) {
    base += '\n我的記錄：已答 ' + a + ' 題 · 答對 ' + store.correct + ' 題 · 正確率 ' +
            Math.round(100 * store.correct / a) + '%' +
            (wrongPool.size ? ' · 錯題 ' + wrongPool.size + ' 題會優先重溫' : '');
  }
  return base;
}
function renderHomeStats(){
  const el = $('homeStats');
  el.textContent = statsText();
  if (store.asked > 0) {
    const b = document.createElement('button');
    b.textContent = '清除練習記錄';
    b.onclick = () => { store.clear(); wrongPool = new Set(); renderHomeStats(); };
    el.appendChild(document.createElement('br'));
    el.appendChild(b);
  }
}

// chapter jump
const toc = $('toc');
CHAPTERS.forEach(([title, page]) => {
  const o = document.createElement('option');
  o.value = page; o.textContent = title;
  toc.appendChild(o);
});
toc.addEventListener('change', () => {
  if (toc.value) {
    $('pdfFrame').src = 'charter.pdf#page=' + toc.value;
    toc.value = '';
  }
});

// ---------- quiz ----------
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function updateMeta(){
  const a = store.asked, pct = a ? Math.round(100 * store.correct / a) : 0;
  $('quizMeta').textContent = '已答 ' + a + ' · 答對 ' + store.correct + ' · ' + pct + '%';
}
function nextQuestion(){
  answered = false;
  quizCount++;
  let pick;
  if (wrongPool.size && Math.random() < 0.25) {
    const wp = [...wrongPool];
    pick = wp[Math.floor(Math.random() * wp.length)];
    if (pick === qIndex && wp.length > 1) pick = wp[(wp.indexOf(pick) + 1) % wp.length];
  } else {
    pick = Math.floor(Math.random() * QUESTIONS.length);
    if (pick === qIndex && QUESTIONS.length > 1)
      pick = (pick + 1 + Math.floor(Math.random() * (QUESTIONS.length - 1))) % QUESTIONS.length;
  }
  qIndex = pick;
  const q = QUESTIONS[qIndex];
  optOrder = shuffle(q.opts.map((_, i) => i));

  $('qNum').textContent = '第 ' + quizCount + ' 題';
  $('qText').textContent = q.q;
  const box = $('opts');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  optOrder.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[pos] + '</span><span class="txt"></span><span class="mark"></span>';
    btn.querySelector('.txt').textContent = q.opts[origIdx];
    btn.onclick = () => choose(pos, btn);
    box.appendChild(btn);
  });
  $('result').textContent = '';
  $('result').className = 'result';
  $('source').textContent = '';
  $('nextBtn').style.display = 'none';
  updateMeta();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function choose(pos, btn){
  if (answered) return;
  answered = true;
  const q = QUESTIONS[qIndex];
  const right = optOrder[pos] === q.a;

  let asked = store.asked + 1, correct = store.correct + (right ? 1 : 0);
  if (right) wrongPool.delete(qIndex); else wrongPool.add(qIndex);
  store.save(asked, correct, wrongPool);

  const btns = [...$('opts').children];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (optOrder[i] === q.a) {
      b.classList.add('correct');
      b.querySelector('.mark').textContent = '✓';
    } else if (i === pos) {
      b.classList.add('wrong');
      b.querySelector('.mark').textContent = '✗';
    } else {
      b.classList.add('dim');
    }
  });

  const r = $('result');
  r.textContent = right ? '✓ 答對了！' : '✗ 答錯了';
  r.className = 'result ' + (right ? 'ok' : 'bad');
  let s = '';
  if (q.src) s += '出處：' + q.src;
  if (q.exp) s += (s ? '\n' : '') + q.exp;
  $('source').textContent = s;
  $('nextBtn').style.display = 'block';
  updateMeta();
}

$('startBtn').onclick = () => {
  $('homeView').style.display = 'none';
  $('quizView').style.display = 'block';
  quizCount = 0;
  nextQuestion();
};
$('backBtn').onclick = () => {
  $('quizView').style.display = 'none';
  $('homeView').style.display = 'block';
  renderHomeStats();
  window.scrollTo({ top: 0 });
};
$('nextBtn').onclick = nextQuestion;

renderHomeStats();
</script>
